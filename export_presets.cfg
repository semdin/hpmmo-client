; HPMMO Windows Desktop export preset.
;
; This file is staged into the project root as export_presets.cfg by
; .github/workflows/client-release.yml before the client export, so the
; release pipeline owns its export configuration without the repository root
; carrying a Godot editor file. If the project ever commits its own
; export_presets.cfg, the workflow keeps that one instead.
;
; Deliberate choices:
;   * binary_format/embed_pck=false  -> hpmmo.exe + hpmmo.pck, so the
;     launcher's repair check can validate files individually;
;   * application/modify_resources=true -> the exe carries the game icon and
;     the Thousand Realms product name; Godot 4.7 edits the PE resources itself
;     (TemplateModifier, no rcedit), so the export still works on a Linux runner;
;   * debug/export_console_wrapper=0 -> one executable in the package.
[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/terrain/grounds/scatter/*.bin"
exclude_filter=""
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name="Thousand Realms"
application/file_description="Thousand Realms"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=false
codesign/enable=false
codesign/identity=""
codesign/password=""
codesign/timestamp=true
codesign/timestamp_server_url=""
codesign/digest_algorithm=1
codesign/description=""
codesign/custom_options=PackedStringArray()
ssh_remote_deploy/enabled=false

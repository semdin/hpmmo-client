# HPMMO client release -> GitHub Releases (what the launcher updates from).
#
#   push to main       -> export the game, build the launcher, package, sign the
#                         manifest, and publish GitHub Release v<version>
#                         (marked "latest": every launcher sees it on its next check)
#   manual dispatch    -> the same, on demand (optionally with release notes)
#
# How the launcher consumes it (launcher_cpp/src/common.h):
#   https://github.com/<repo>/releases/latest/download/manifest.json (+ .sig)
#   -> verifies the Ed25519 signature with the key built into the launcher
#   -> launcher_version newer than its own build?  replace HPMMO_Launcher.exe first
#   -> client_version differs from the installed one?  download the zip, check
#      size + sha256 from the signed manifest, install, activate
#   -> PLAY starts the game at its own login screen.
#
# Versions are automatic:
#   client   1.0.<run number>                       (every release is newer)
#   launcher 3.0.<unix time of the last commit touching launcher_cpp/>
#            (a release that did not change the launcher does not re-install it)
#
# Required secret: HPMMO_CLIENT_SIGNING_KEY = the Ed25519 private key (PEM, or the
# 32-byte seed as 64 hex characters) whose
# public half is HPMMO_DEFAULT_RELEASE_KEY in launcher_cpp/src/common.h. The job
# fails closed without it: an unsigned manifest is never published.
name: client-release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/downloads/**'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes shown in the launcher (default: the commit message)'
        type: string
        required: false

permissions:
  contents: write   # create the GitHub Release and upload its assets

concurrency:
  # Releases are published one at a time and never cancelled half way.
  group: client-release
  cancel-in-progress: false

env:
  GODOT_VERSION: '4.7.2'
  PLATFORM: 'windows-x86_64'
  MIN_LAUNCHER_VERSION: '3.0.0'
  PROTOCOL_VERSION: '10'
  PROTOCOL_MIN: '10'
  PROTOCOL_MAX: '10'
  SERVER_VERSION: '1.1.0'
  SCHEMA_VERSION: '4'

jobs:
  release:
    name: build + sign + publish (windows-x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Require the signing key (fail closed)
        env:
          SIGNING_KEY: ${{ secrets.HPMMO_CLIENT_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::HPMMO_CLIENT_SIGNING_KEY is not set (Settings -> Secrets and variables -> Actions)."
            echo "Without it no manifest can be signed, and the launcher refuses unsigned releases."
            exit 1
          fi
          echo "signing key present (value never printed)"

      # Full history for the launcher version. The game's models/textures are
      # Git LFS objects (~700 MB): they are pulled through a cache keyed by the
      # object list, so a release only downloads the objects that changed and
      # the repository's LFS bandwidth quota is not spent on every push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List the LFS objects of this commit
        # hashFiles() only reads inside the workspace.
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-ids.txt

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids.txt') }}
          restore-keys: lfs-

      - name: Pull the LFS objects (cache misses only)
        run: |
          git lfs pull
          # A pointer file left in the tree would export as a broken asset.
          if git lfs ls-files | grep -q ' - '; then
            echo "::error::some LFS objects were not downloaded"; git lfs ls-files | grep ' - ' | head; exit 1
          fi

      - name: Resolve versions
        id: v
        env:
          NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          set -eu
          client="1.0.${GITHUB_RUN_NUMBER}"
          content="$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          launcher_ts="$(git log -1 --format=%ct -- launcher_cpp)"
          launcher="3.0.${launcher_ts:-0}"
          notes="${NOTES_INPUT:-}"
          if [ -z "$notes" ]; then notes="$(git log -1 --format=%s)"; fi
          {
            echo "client=$client"
            echo "content=$content"
            echo "launcher=$launcher"
            echo "tag=v$client"
          } >> "$GITHUB_OUTPUT"
          # Multi-line safe notes for later steps.
          printf '%s' "$notes" > "$RUNNER_TEMP/release_notes.txt"
          echo "client $client / content $content / launcher $launcher"

      - name: Install the toolchain (python + mingw + ninja + cmake)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-pip ninja-build cmake mingw-w64
          python3 -m pip install --quiet cryptography

      - name: Fetch the pinned Godot engine and export templates
        id: godot
        run: |
          set -eu
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          godot="/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$godot"
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          rm -rf /tmp/templates "${HOME:?}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q -o /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          echo "path=$godot" >> "$GITHUB_OUTPUT"

      - name: Export the game
        run: |
          set -eu
          rm -rf build && mkdir -p build/client
          if [ ! -f export_presets.cfg ]; then
            cp tools/release/windows-desktop.export_presets.cfg export_presets.cfg
          fi
          # The login screen shows this version.
          sed -i "s/^config\/description=/config\/version=\"${{ steps.v.outputs.client }}\"\nconfig\/description=/" project.godot
          "${{ steps.godot.outputs.path }}" --headless --path . --editor --import --quit \
            > /tmp/import.log 2>&1 || { tail -80 /tmp/import.log; exit 1; }
          "${{ steps.godot.outputs.path }}" --headless --path . \
            --export-release "Windows Desktop" "$PWD/build/client/HPMMO.exe" \
            > /tmp/export.log 2>&1 || { tail -80 /tmp/export.log; echo "the Godot export failed" >&2; exit 1; }
          test -f build/client/HPMMO.exe
          test -f build/client/HPMMO.pck
          ls -la build/client

      - name: Build the launcher
        run: |
          set -eu
          cmake -S launcher_cpp -B launcher_cpp/build-mingw -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_BUILD_TYPE=Release \
            -DHPMMO_LAUNCHER_VERSION="${{ steps.v.outputs.launcher }}"
          ninja -C launcher_cpp/build-mingw HPMMO_Launcher
          mkdir -p dist
          cp launcher_cpp/build-mingw/HPMMO_Launcher.exe dist/HPMMO_Launcher.exe

      - name: Package the client (refuses user data, caches and secrets)
        run: |
          python3 tools/release/package_client.py \
            --build-dir build \
            --client-version "${{ steps.v.outputs.client }}" \
            --content-version "${{ steps.v.outputs.content }}" \
            --platform "$PLATFORM" \
            --out dist

      - name: Sign the manifest
        env:
          SIGNING_KEY: ${{ secrets.HPMMO_CLIENT_SIGNING_KEY }}
        run: |
          set -eu
          key="$RUNNER_TEMP/hpmmo-client-release.key.pem"
          umask 077
          # The secret is either a PEM private key or the raw 32-byte Ed25519
          # seed as 64 hex characters (wrapped into PKCS#8 here).
          seed="$(printf '%s' "$SIGNING_KEY" | tr -d '[:space:]')"
          if printf '%s' "$seed" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            { printf '302e020100300506032b657004220420'; printf '%s' "$seed"; } | xxd -r -p > "$RUNNER_TEMP/seed.der"
            openssl pkey -inform DER -in "$RUNNER_TEMP/seed.der" -out "$key"
            rm -f "$RUNNER_TEMP/seed.der"
          else
            printf '%s\n' "$SIGNING_KEY" > "$key"
          fi
          python3 tools/release/gen_manifest.py \
            --artifact "dist/hpmmo-client-${{ steps.v.outputs.client }}-$PLATFORM.zip" \
            --launcher-artifact dist/HPMMO_Launcher.exe \
            --launcher-version "${{ steps.v.outputs.launcher }}" \
            --channel release \
            --client-version "${{ steps.v.outputs.client }}" \
            --min-launcher-version "$MIN_LAUNCHER_VERSION" \
            --protocol-version "$PROTOCOL_VERSION" --protocol-min "$PROTOCOL_MIN" --protocol-max "$PROTOCOL_MAX" \
            --content-version "${{ steps.v.outputs.content }}" --server-version "$SERVER_VERSION" \
            --schema-version "$SCHEMA_VERSION" --platform "$PLATFORM" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}" \
            --release-notes-file "$RUNNER_TEMP/release_notes.txt" \
            --out dist --key "$key"
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/release.pub.pem"
          rm -f "$key"
          python3 tools/release/gen_manifest.py --verify \
            --manifest dist/manifest.json --pubkey "$RUNNER_TEMP/release.pub.pem" --artifacts dist
          # The key the launcher has built in must be the key that signed this.
          built_in="$(grep -o 'HPMMO_DEFAULT_RELEASE_KEY L"[^"]*"' launcher_cpp/src/common.h | sed 's/.*L"\(.*\)"/\1/')"
          signing="$(openssl pkey -pubin -in "$RUNNER_TEMP/release.pub.pem" -outform DER | tail -c 32 | base64)"
          if [ "$built_in" != "$signing" ]; then
            echo "::error::the signing key does not match HPMMO_DEFAULT_RELEASE_KEY in launcher_cpp/src/common.h"
            exit 1
          fi
          ls -la dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ steps.v.outputs.tag }}"
          gh release create "$tag" \
            "dist/hpmmo-client-${{ steps.v.outputs.client }}-$PLATFORM.zip" \
            dist/HPMMO_Launcher.exe \
            dist/manifest.json dist/manifest.json.sig dist/manifest.json.keyid dist/SHA256SUMS \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "HPMMO $tag" \
            --notes-file "$RUNNER_TEMP/release_notes.txt" \
            --latest

      - name: Verify what launchers will download
        run: |
          set -eu
          base="https://github.com/${{ github.repository }}/releases/latest/download"
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "$base/manifest.json" -o "$RUNNER_TEMP/live.json"; then break; fi
            sleep 10
          done
          curl -fsSL "$base/manifest.json.sig" -o "$RUNNER_TEMP/live.json.sig"
          python3 tools/release/gen_manifest.py --verify \
            --manifest "$RUNNER_TEMP/live.json" --pubkey "$RUNNER_TEMP/release.pub.pem" --artifacts dist
          {
            echo "### HPMMO ${{ steps.v.outputs.tag }}"
            echo "- client \`${{ steps.v.outputs.client }}\`, launcher \`${{ steps.v.outputs.launcher }}\`"
            echo "- installer link: $base/HPMMO_Launcher.exe"
          } >> "$GITHUB_STEP_SUMMARY"

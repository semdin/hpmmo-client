# HPMMO client release -> GitHub Releases (what the launcher updates from).
# Since 1.0.64 the game ships as chunks only (content*.json + chunks*.bin):
# no full zip; the launchers install and repair from chunks.
#
#   push to main       -> export the game, build the launcher, package, sign the
#                         manifest, and publish GitHub Release v<version>
#                         (marked "latest": every launcher sees it on its next check)
#   manual dispatch    -> the same, on demand (optionally with release notes)
#
# How the launcher consumes it (launcher_cpp/src/common.h):
#   https://github.com/<repo>/releases/latest/download/manifest.json (+ .sig)
#   -> verifies the Ed25519 signature with the key built into the launcher
#   -> launcher_version newer than its own build?  replace HPMMO_Launcher.exe first
#   -> client_version differs from the installed one?  fetch content.json (its
#      sha256 is in the signed manifest), copy every chunk the installed version
#      already has, download only the missing chunks (HTTP Range into the
#      chunks-<ver>.bin of the release that introduced them), verify each chunk
#      and file, activate. The full zip stays as the fallback.
#   Old releases must NOT be deleted: newer releases reference their chunks.
#   -> PLAY starts the game at its own login screen.
#
# Versions are automatic:
#   client   1.0.<run number>                       (every release is newer)
#   launcher 3.0.<unix time of the last commit touching launcher_cpp/>
#            (a release that did not change the launcher does not re-install it)
#
# Required secret: HPMMO_CLIENT_SIGNING_KEY = the Ed25519 private key (PEM, or the
# 32-byte seed as 64 hex characters) whose
# public half is HPMMO_DEFAULT_RELEASE_KEY in launcher_cpp/src/common.h. The job
# fails closed without it: an unsigned manifest is never published.
name: client-release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/downloads/**'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes shown in the launcher (default: the commit message)'
        type: string
        required: false

permissions:
  contents: write   # create the GitHub Release and upload its assets

concurrency:
  # Releases are published one at a time and never cancelled half way.
  group: client-release
  cancel-in-progress: false

env:
  GODOT_VERSION: '4.7.2'
  PLATFORM: 'windows-x86_64'
  MIN_LAUNCHER_VERSION: '3.0.0'
  PROTOCOL_VERSION: '10'
  PROTOCOL_MIN: '10'
  PROTOCOL_MAX: '10'
  SERVER_VERSION: '1.1.0'
  SCHEMA_VERSION: '4'

jobs:
  # macOS launcher: needs a Mac to compile, link and sign, so it runs on a
  # GitHub-hosted macOS runner (free for this public repository). The release
  # job below picks the result up as an artifact. Its sources need no LFS: the
  # launcher's assets are plain git (.gitattributes).
  launcher-macos:
    name: macOS launcher (universal, ad-hoc signed) + updater tests
    runs-on: macos-14
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the launcher version is the last launcher_cpp commit time
          lfs: false

      - name: Resolve the launcher version
        id: v
        run: |
          launcher_ts="$(git log -1 --format=%ct -- launcher_cpp)"
          echo "launcher=3.0.${launcher_ts:-0}" >> "$GITHUB_OUTPUT"

      - name: Build the app bundle
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          bash launcher_cpp/packaging/macos/build_app.sh launcher_cpp "${{ steps.v.outputs.launcher }}" "$RUNNER_TEMP/mac"

      - name: Updater tests against the macOS build (113 checks)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography numpy
          "$RUNNER_TEMP/venv/bin/python" tools/release/test_updater.py \
            --launcher "$RUNNER_TEMP/mac/HPMMO_UpdaterCLI-macos" \
            --gui-launcher "$RUNNER_TEMP/mac/HPMMO_Launcher-macos" | tee "$RUNNER_TEMP/updater-tests.log"
          grep -q "UPDATER RESULT: .*, 0 failures" "$RUNNER_TEMP/updater-tests.log"

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-macos
          path: |
            ${{ runner.temp }}/mac/HPMMO_Launcher-macos.zip
            ${{ runner.temp }}/mac/HPMMO_Launcher-macos
          if-no-files-found: error
          retention-days: 7

  release:
    name: build + sign + publish (windows, linux, macos)
    needs: [launcher-macos]
    # Self-hosted on the game host (2026-10-19): the workspace persists, so Git
    # LFS only fetches changed objects and the .godot import cache survives
    # between releases without a GitHub cache round trip. Never add a
    # pull_request trigger to this workflow.
    runs-on: [self-hosted, hpmmo-client]
    steps:
      - name: Require the signing key (fail closed)
        env:
          SIGNING_KEY: ${{ secrets.HPMMO_CLIENT_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::HPMMO_CLIENT_SIGNING_KEY is not set (Settings -> Secrets and variables -> Actions)."
            echo "Without it no manifest can be signed, and the launcher refuses unsigned releases."
            exit 1
          fi
          echo "signing key present (value never printed)"

      # Full history for the launcher version. clean: false keeps the ignored
      # .godot import cache: Godot re-imports only changed sources, so unchanged
      # models/textures keep byte-identical output and players do not
      # re-download their chunks (imports are not bit-reproducible).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Reset the workspace (keep only the import cache)
        run: |
          set -eu
          # Untracked leftovers of an earlier run must not leak into this one
          # (a stale chunks-*.bin in dist/ would be published).
          git clean -ffdx -e .godot -e export_presets.cfg
          # LFS comes from our own server (lfs.agsilvery.com -> Cloudflare R2,
          # see .lfsconfig; the runner user holds its credentials).
          git lfs pull
          # A pointer file left in the tree would export as a broken asset.
          if git lfs ls-files | grep -q ' - '; then
            echo "::error::some LFS objects were not downloaded"; git lfs ls-files | grep ' - ' | head; exit 1
          fi

      - name: Resolve versions
        id: v
        env:
          NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          set -eu
          client="1.0.${GITHUB_RUN_NUMBER}"
          content="$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          launcher_ts="$(git log -1 --format=%ct -- launcher_cpp)"
          launcher="3.0.${launcher_ts:-0}"
          notes="${NOTES_INPUT:-}"
          if [ -z "$notes" ]; then notes="$(git log -1 --format=%s)"; fi
          {
            echo "client=$client"
            echo "content=$content"
            echo "launcher=$launcher"
            echo "tag=v$client"
          } >> "$GITHUB_OUTPUT"
          # Multi-line safe notes for later steps.
          printf '%s' "$notes" > "$RUNNER_TEMP/release_notes.txt"
          echo "client $client / content $content / launcher $launcher"

      - name: Build the launcher
        run: |
          set -eu
          # The -posix toolchain: the default win32-thread variant has no std::thread/std::mutex.
          cmake -S launcher_cpp -B launcher_cpp/build-mingw -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc-posix \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_BUILD_TYPE=Release \
            -DHPMMO_LAUNCHER_VERSION="${{ steps.v.outputs.launcher }}"
          # Compiler errors become annotations, readable without the job log.
          if ! ninja -k 0 -C launcher_cpp/build-mingw HPMMO_Launcher > "$RUNNER_TEMP/launcher-build.log" 2>&1; then
            grep -E "error|Error" "$RUNNER_TEMP/launcher-build.log" | head -25 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -60 "$RUNNER_TEMP/launcher-build.log"
            exit 1
          fi
          mkdir -p dist
          cp launcher_cpp/build-mingw/HPMMO_Launcher.exe dist/HPMMO_Launcher.exe

      - name: Fetch the macOS launcher built by launcher-macos
        uses: actions/download-artifact@v4
        with:
          name: launcher-macos
          path: dist

      - name: Build the Linux launcher (AppImage)
        # Built in the pinned Ubuntu 22.04 image (launcher_cpp/packaging/linux)
        # through the host's root wrapper, so it runs on glibc >= 2.34 distros.
        run: |
          set -eu
          out="$RUNNER_TEMP/linux-launcher"
          rm -rf "$out"
          sudo /opt/hpmmo-ci/build_linux_launcher.sh "$PWD/launcher_cpp" "${{ steps.v.outputs.launcher }}" "$out"
          cp "$out/HPMMO_Launcher-x86_64.AppImage" dist/HPMMO_Launcher-x86_64.AppImage
          ls -la dist/HPMMO_Launcher-x86_64.AppImage

      - name: Check the pinned Godot engine and export templates
        id: godot
        run: |
          set -eu
          # Installed once on the host (server/docs/self-hosted-runner.md).
          godot=/opt/hpmmo-ci/godot/godot
          "$godot" --version | grep -q "^${GODOT_VERSION}\.stable" || {
            echo "::error::$godot is not Godot ${GODOT_VERSION}"; exit 1; }
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/windows_release_x86_64.exe" || {
            echo "::error::Godot ${GODOT_VERSION} export templates are missing in $HOME"; exit 1; }
          echo "path=$godot" >> "$GITHUB_OUTPUT"

      - name: Export the game (Windows + Linux)
        run: |
          set -eu
          rm -rf build build-linux && mkdir -p build/client build-linux/client
          # Always the release presets: export_presets.cfg is gitignored and the
          # runner keeps it between runs, so a stale copy must never win.
          cp tools/release/release.export_presets.cfg export_presets.cfg
          # The login screen shows this version.
          sed -i "s/^config\/description=/config\/version=\"${{ steps.v.outputs.client }}\"\nconfig\/description=/" project.godot
          "${{ steps.godot.outputs.path }}" --headless --path . --editor --import --quit \
            > "$RUNNER_TEMP/import.log" 2>&1 || { tail -80 "$RUNNER_TEMP/import.log"; exit 1; }
          "${{ steps.godot.outputs.path }}" --headless --path . \
            --export-release "Windows Desktop" "$PWD/build/client/HPMMO.exe" \
            > "$RUNNER_TEMP/export.log" 2>&1 || { tail -80 "$RUNNER_TEMP/export.log"; echo "the Godot export failed" >&2; exit 1; }
          test -f build/client/HPMMO.exe
          test -f build/client/HPMMO.pck
          ls -la build/client
          "${{ steps.godot.outputs.path }}" --headless --path . \
            --export-release "Linux" "$PWD/build-linux/client/HPMMO.x86_64" \
            > "$RUNNER_TEMP/export-linux.log" 2>&1 || { tail -80 "$RUNNER_TEMP/export-linux.log"; echo "the Linux export failed" >&2; exit 1; }
          test -x build-linux/client/HPMMO.x86_64
          test -f build-linux/client/HPMMO.pck
          ls -la build-linux/client
          # macOS: x86_64 .app (Rosetta 2 on Apple Silicon) from an x86_64
          # template thinned out of the official universal one, made once.
          template=/opt/hpmmo-ci/godot/macos_x86_64-${GODOT_VERSION}.zip
          if [ ! -f "$template" ]; then
            python3 tools/release/make_macos_x86_template.py \
              "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/macos.zip" "$template"
          fi
          rm -rf build-mac && mkdir -p build-mac/client
          "${{ steps.godot.outputs.path }}" --headless --path . \
            --export-release "macOS" "$RUNNER_TEMP/HPMMO-macos.zip" \
            > "$RUNNER_TEMP/export-macos.log" 2>&1 || { tail -80 "$RUNNER_TEMP/export-macos.log"; echo "the macOS export failed" >&2; exit 1; }
          unzip -q "$RUNNER_TEMP/HPMMO-macos.zip" -d build-mac/client
          rm -f "$RUNNER_TEMP/HPMMO-macos.zip"
          test -x build-mac/client/HPMMO.app/Contents/MacOS/HPMMO
          test -f build-mac/client/HPMMO.app/Contents/Resources/HPMMO.pck
          test -d build-mac/client/HPMMO.app/Contents/Frameworks/libterrain.macos.release.framework

      # No full zip since 1.0.64: the packager only enforces its refusal rules
      # (no user data, caches or secrets) on what the chunks are cut from.
      - name: Validate the client builds (refuses user data, caches and secrets)
        run: |
          python3 tools/release/package_client.py \
            --build-dir build \
            --client-version "${{ steps.v.outputs.client }}" \
            --content-version "${{ steps.v.outputs.content }}" \
            --platform "$PLATFORM" \
            --check
          python3 tools/release/package_client.py \
            --build-dir build-linux \
            --client-version "${{ steps.v.outputs.client }}" \
            --content-version "${{ steps.v.outputs.content }}" \
            --platform linux-x86_64 \
            --check
          python3 tools/release/package_client.py \
            --build-dir build-mac \
            --client-version "${{ steps.v.outputs.client }}" \
            --content-version "${{ steps.v.outputs.content }}" \
            --platform macos \
            --check

      # Delta delivery: chunks the previous release already published are
      # referenced, only new ones go into chunks-<ver>.bin.
      - name: Chunk the build (delta updates)
        run: |
          set -eu
          prev="$RUNNER_TEMP/previous-content.json"
          if ! curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/content.json" -o "$prev"; then
            echo "no previous content index: every chunk is new"
            rm -f "$prev"
          fi
          python3 tools/release/chunk_release.py \
            --build-dir build/client \
            --version "${{ steps.v.outputs.client }}" \
            --download-base "https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}" \
            --previous "$prev" \
            --out dist
          # Linux: content-linux-x86_64.json / chunks-linux-x86_64-<ver>.bin
          prev_linux="$RUNNER_TEMP/previous-content-linux.json"
          if ! curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/content-linux-x86_64.json" -o "$prev_linux"; then
            echo "no previous Linux content index: every Linux chunk is new"
            rm -f "$prev_linux"
          fi
          python3 tools/release/chunk_release.py \
            --build-dir build-linux/client \
            --platform linux-x86_64 \
            --version "${{ steps.v.outputs.client }}" \
            --download-base "https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}" \
            --previous "$prev_linux" \
            --out dist
          # macOS: content-macos.json / chunks-macos-<ver>.bin
          prev_mac="$RUNNER_TEMP/previous-content-macos.json"
          if ! curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/content-macos.json" -o "$prev_mac"; then
            echo "no previous macOS content index: every macOS chunk is new"
            rm -f "$prev_mac"
          fi
          python3 tools/release/chunk_release.py \
            --build-dir build-mac/client \
            --platform macos \
            --version "${{ steps.v.outputs.client }}" \
            --download-base "https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}" \
            --previous "$prev_mac" \
            --out dist

      - name: Sign the manifest
        env:
          SIGNING_KEY: ${{ secrets.HPMMO_CLIENT_SIGNING_KEY }}
        run: |
          set -eu
          key="$RUNNER_TEMP/hpmmo-client-release.key.pem"
          umask 077
          # The secret is either a PEM private key or the raw 32-byte Ed25519
          # seed as 64 hex characters (wrapped into PKCS#8 here).
          seed="$(printf '%s' "$SIGNING_KEY" | tr -d '[:space:]')"
          if printf '%s' "$seed" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            { printf '302e020100300506032b657004220420'; printf '%s' "$seed"; } | xxd -r -p > "$RUNNER_TEMP/seed.der"
            openssl pkey -inform DER -in "$RUNNER_TEMP/seed.der" -out "$key"
            rm -f "$RUNNER_TEMP/seed.der"
          else
            printf '%s\n' "$SIGNING_KEY" > "$key"
          fi
          python3 tools/release/gen_manifest.py \
            --launcher-artifact dist/HPMMO_Launcher.exe \
            --launcher-version "${{ steps.v.outputs.launcher }}" \
            --channel release \
            --client-version "${{ steps.v.outputs.client }}" \
            --min-launcher-version "$MIN_LAUNCHER_VERSION" \
            --protocol-version "$PROTOCOL_VERSION" --protocol-min "$PROTOCOL_MIN" --protocol-max "$PROTOCOL_MAX" \
            --content-version "${{ steps.v.outputs.content }}" --server-version "$SERVER_VERSION" \
            --schema-version "$SCHEMA_VERSION" --platform "$PLATFORM" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}" \
            --release-notes-file "$RUNNER_TEMP/release_notes.txt" \
            --content-index dist/content.json \
            --out dist --key "$key"
          # Linux manifest (with the AppImage as the launcher self-update payload).
          python3 tools/release/gen_manifest.py \
            --launcher-artifact dist/HPMMO_Launcher-x86_64.AppImage \
            --launcher-version "${{ steps.v.outputs.launcher }}" \
            --channel release \
            --client-version "${{ steps.v.outputs.client }}" \
            --min-launcher-version "$MIN_LAUNCHER_VERSION" \
            --protocol-version "$PROTOCOL_VERSION" --protocol-min "$PROTOCOL_MIN" --protocol-max "$PROTOCOL_MAX" \
            --content-version "${{ steps.v.outputs.content }}" --server-version "$SERVER_VERSION" \
            --schema-version "$SCHEMA_VERSION" --platform linux-x86_64 \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}" \
            --release-notes-file "$RUNNER_TEMP/release_notes.txt" \
            --content-index dist/content-linux-x86_64.json \
            --out dist --key "$key"
          # macOS manifest (the bare launcher Mach-O is the self-update payload).
          python3 tools/release/gen_manifest.py \
            --launcher-artifact dist/HPMMO_Launcher-macos \
            --launcher-version "${{ steps.v.outputs.launcher }}" \
            --channel release \
            --client-version "${{ steps.v.outputs.client }}" \
            --min-launcher-version "$MIN_LAUNCHER_VERSION" \
            --protocol-version "$PROTOCOL_VERSION" --protocol-min "$PROTOCOL_MIN" --protocol-max "$PROTOCOL_MAX" \
            --content-version "${{ steps.v.outputs.content }}" --server-version "$SERVER_VERSION" \
            --schema-version "$SCHEMA_VERSION" --platform macos \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}" \
            --release-notes-file "$RUNNER_TEMP/release_notes.txt" \
            --content-index dist/content-macos.json \
            --out dist --key "$key"
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/release.pub.pem"
          rm -f "$key"
          python3 tools/release/gen_manifest.py --verify \
            --manifest dist/manifest.json --pubkey "$RUNNER_TEMP/release.pub.pem" --artifacts dist
          python3 tools/release/gen_manifest.py --verify \
            --manifest dist/manifest-linux-x86_64.json --pubkey "$RUNNER_TEMP/release.pub.pem" --artifacts dist
          python3 tools/release/gen_manifest.py --verify \
            --manifest dist/manifest-macos.json --pubkey "$RUNNER_TEMP/release.pub.pem" --artifacts dist
          # The key the launcher has built in must be the key that signed this.
          built_in="$(grep -o 'HPMMO_DEFAULT_RELEASE_KEY L"[^"]*"' launcher_cpp/src/common.h | sed 's/.*L"\(.*\)"/\1/')"
          signing="$(openssl pkey -pubin -in "$RUNNER_TEMP/release.pub.pem" -outform DER | tail -c 32 | base64)"
          if [ "$built_in" != "$signing" ]; then
            echo "::error::the signing key does not match HPMMO_DEFAULT_RELEASE_KEY in launcher_cpp/src/common.h"
            exit 1
          fi
          ls -la dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ steps.v.outputs.tag }}"
          # chunks[-<platform>]-<ver>.bin is absent when no chunk changed.
          shopt -s nullglob
          chunks=(dist/chunks-*.bin)
          gh release create "$tag" \
            dist/HPMMO_Launcher.exe dist/content.json "${chunks[@]}" \
            dist/manifest.json dist/manifest.json.sig dist/manifest.json.keyid dist/SHA256SUMS \
            dist/content-linux-x86_64.json \
            dist/HPMMO_Launcher-x86_64.AppImage \
            dist/manifest-linux-x86_64.json dist/manifest-linux-x86_64.json.sig \
            dist/manifest-linux-x86_64.json.keyid dist/SHA256SUMS-linux-x86_64 \
            dist/content-macos.json dist/HPMMO_Launcher-macos dist/HPMMO_Launcher-macos.zip \
            dist/manifest-macos.json dist/manifest-macos.json.sig \
            dist/manifest-macos.json.keyid dist/SHA256SUMS-macos \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "HPMMO $tag" \
            --notes-file "$RUNNER_TEMP/release_notes.txt" \
            --latest

      - name: Verify what launchers will download
        run: |
          set -eu
          base="https://github.com/${{ github.repository }}/releases/latest/download"
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "$base/manifest.json" -o "$RUNNER_TEMP/live.json"; then break; fi
            sleep 10
          done
          curl -fsSL "$base/manifest.json.sig" -o "$RUNNER_TEMP/live.json.sig"
          python3 tools/release/gen_manifest.py --verify \
            --manifest "$RUNNER_TEMP/live.json" --pubkey "$RUNNER_TEMP/release.pub.pem" --artifacts dist
          curl -fsSL "$base/manifest-linux-x86_64.json" -o "$RUNNER_TEMP/live-linux.json"
          curl -fsSL "$base/manifest-linux-x86_64.json.sig" -o "$RUNNER_TEMP/live-linux.json.sig"
          python3 tools/release/gen_manifest.py --verify \
            --manifest "$RUNNER_TEMP/live-linux.json" --pubkey "$RUNNER_TEMP/release.pub.pem" --artifacts dist
          curl -fsSL "$base/manifest-macos.json" -o "$RUNNER_TEMP/live-macos.json"
          curl -fsSL "$base/manifest-macos.json.sig" -o "$RUNNER_TEMP/live-macos.json.sig"
          python3 tools/release/gen_manifest.py --verify \
            --manifest "$RUNNER_TEMP/live-macos.json" --pubkey "$RUNNER_TEMP/release.pub.pem" --artifacts dist
          {
            echo "### HPMMO ${{ steps.v.outputs.tag }}"
            echo "- client \`${{ steps.v.outputs.client }}\`, launcher \`${{ steps.v.outputs.launcher }}\`"
            echo "- installer link: $base/HPMMO_Launcher.exe"
            echo "- Linux launcher: $base/HPMMO_Launcher-x86_64.AppImage"
            echo "- macOS launcher: $base/HPMMO_Launcher-macos.zip"
          } >> "$GITHUB_STEP_SUMMARY"

  # The published release, on a Mac: the downloaded launcher installs the game
  # from the macOS chunks and the installed game boots (headless; on this
  # Apple Silicon runner the x86_64 game runs through Rosetta 2).
  verify-macos:
    name: macOS install + boot check
    needs: [release]
    runs-on: macos-14
    steps:
      - name: Install the release with the published launcher and boot the game
        run: |
          set -eu
          base="https://github.com/${{ github.repository }}/releases/latest/download"
          work="$RUNNER_TEMP/hpmmo"
          mkdir -p "$work" && cd "$work"
          curl -fsSL -o launcher.zip "$base/HPMMO_Launcher-macos.zip"
          ditto -x -k launcher.zip .
          codesign --verify --deep --strict "HPMMO Launcher.app"
          bin="$work/HPMMO Launcher.app/Contents/MacOS/HPMMO_Launcher"
          "$bin" --install-root "$work/install" --user-dir "$work/install/user" --update | tee update.json
          grep -q '"ok":true' update.json
          game="$(ls -d "$work"/install/versions/*/HPMMO.app/Contents/MacOS/HPMMO)"
          chmod +x "$game"
          codesign --verify --deep --strict "$(dirname "$(dirname "$(dirname "$game")")")"
          # The x86_64 game needs Rosetta 2 on Apple Silicon (a player's Mac
          # offers to install it on the first start).
          if [ "$(uname -m)" = "arm64" ] && ! /usr/bin/pgrep -q oahd; then
            sudo softwareupdate --install-rosetta --agree-to-license || true
          fi
          # A pty keeps Godot's output line-buffered.
          script -q "$work/boot.log" "$game" --headless --quit-after 600 || true
          cat "$work/boot.log" | tr -d '\r' | tail -20
          grep -q "Loaded client configuration" "$work/boot.log"

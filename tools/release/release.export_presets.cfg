; HPMMO release export presets (Windows, Linux, macOS).
;
; .github/workflows/client-release.yml copies this file over the project's
; export_presets.cfg before every export (the file is gitignored, and the
; self-hosted runner keeps its workspace between releases, so a stale copy
; must never win). preset.0 is the original Windows preset, unchanged.
;
; Deliberate choices:
;   * binary_format/embed_pck=false  -> HPMMO.exe/HPMMO.x86_64 + HPMMO.pck, so
;     the launcher's repair check can validate files individually;
;   * application/modify_resources=false -> no rcedit dependency, so the export
;     works on a Linux runner without wine;
;   * debug/export_console_wrapper=0 -> one executable in the package.
[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
application/modify_resources=false
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name="HPMMO"
application/file_description=""
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=false
codesign/enable=false
codesign/identity=""
codesign/password=""
codesign/timestamp=true
codesign/timestamp_server_url=""
codesign/digest_algorithm=1
codesign/description=""
codesign/custom_options=PackedStringArray()
ssh_remote_deploy/enabled=false


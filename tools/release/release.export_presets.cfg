[preset.2.options]
; x86_64 (Intel native, Apple Silicon through Rosetta 2: a universal build needs
; ETC2/ASTC texture imports for every asset); ad-hoc signed by Godot's built-in
; rcodesign (no Apple Developer certificate); no notarization: the launcher
; downloads the game itself, so it never carries a quarantine flag.
export/distribution_type=1
binary_format/architecture="x86_64"
; Made once on the runner by tools/release/make_macos_x86_template.py.
custom_template/debug="/opt/hpmmo-ci/godot/macos_x86_64-4.7.2.zip"
custom_template/release="/opt/hpmmo-ci/godot/macos_x86_64-4.7.2.zip"
debug/export_console_wrapper=0
application/icon=""
application/bundle_identifier="com.hpmmo.client"
application/signature=""
application/app_category="Games"
application/short_version="1.0"
application/version="1.0"
application/copyright=""
application/min_macos_version_x86_64="10.13"
application/min_macos_version_arm64="11.00"
display/high_res=true
codesign/codesign=1
codesign/installer_identity=""
codesign/apple_team_id=""
codesign/identity=""
codesign/entitlements/custom_file=""
codesign/entitlements/allow_jit_code_execution=false
codesign/entitlements/allow_unsigned_executable_memory=false
codesign/entitlements/allow_dyld_environment_variables=false
codesign/entitlements/disable_library_validation=true
codesign/entitlements/audio_input=false
codesign/entitlements/camera=false
codesign/entitlements/location=false
codesign/entitlements/address_book=false
codesign/entitlements/calendars=false
codesign/entitlements/photos_library=false
codesign/entitlements/apple_events=false
codesign/entitlements/debugging=false
codesign/entitlements/app_sandbox/enabled=false
codesign/custom_options=PackedStringArray()
notarization/notarization=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
ssh_remote_deploy/enabled=false
